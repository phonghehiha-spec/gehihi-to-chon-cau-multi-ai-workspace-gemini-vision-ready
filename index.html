Khi người dùng yêu cầu viết code Python, Script hoặc Addon cho Blender, bạn BẮT BUỘC tuân thủ nghiêm ngặt chuẩn API của Blender 5.0 / 4.x sau đây để người dùng cài đặt và chạy thành công 100% ngay lần đầu tiên:
1. KHAI BÁO bl_info CHUẨN BLENDER 5.0:

2. CẬP NHẬT API MỚI NHẤT CỦA BLENDER 5.0 (TUYỆT ĐỐI KHÔNG DÙNG API CŨ ĐÃ BỊ XÓA):
   - Context Override: BẮT BUỘC dùng \`with bpy.context.temp_override(**override_kwargs):\` thay vì truyền dictionary trực tiếp vào \`bpy.ops\` như Blender 3.x cũ.
   - Auto Smooth / Shade Smooth: Thuộc tính \`mesh.use_auto_smooth\` đã bị loại bỏ hoàn toàn. Hãy dùng \`bpy.ops.object.shade_smooth()\` hoặc thêm Modifier "Smooth by Angle".
   - Principled BSDF Shader Nodes: Sử dụng đúng tên socket của Blender 4.x/5.0: \`'Specular IOR Level'\` (thay cho Specular), \`'Transmission Weight'\` (thay cho Transmission), \`'Coat Weight'\` (thay cho Clearcoat), \`'Sheen Weight'\` (thay cho Sheen), \`'Emission Color'\` và \`'Emission Strength'\`.
   - Đồ họa Viewport 2D/3D: Tuyệt đối KHÔNG import module \`bgl\` (đã bị xóa). Bắt buộc dùng module \`gpu\` và \`gpu_extras.batch.batch_for_shader\`.
   - Khai báo Property (PEP 526 Type Annotations): Mọi thuộc tính của \`bpy.types.PropertyGroup\` và \`bpy.types.Operator\` PHẢI dùng dấu hai chấm (\`:\`), tuyệt đối không dùng dấu bằng (\`=\`). Ví dụ: \`bevel_width: bpy.props.FloatProperty(name="Width", default=0.02, min=0.0)\`.

   - Có đầy đủ \`bpy.types.PropertyGroup\`, \`bpy.types.Operator\` (kèm \`bl_options = {'REGISTER', 'UNDO'}\`), và \`bpy.types.Panel\` hiển thị trực quan trên N-Panel (\`bl_space_type = 'VIEW_3D'\`, \`bl_region_type = 'UI'\`).
   - Có tuple \`CLASSES = (...)\`, hàm \`register()\` và \`unregister()\` bọc \`try...except\` an toàn và kết thúc bằng \`if __name__ == "__main__": register()\`.

    async function normalizeImageFileForGemini(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Không thể đọc tệp ảnh: " + file.name));
        reader.onload = () => {
          const rawDataUrl = String(reader.result || '');
          const img = new Image();
          img.onload = () => {
            try {
              const MAX_DIM = 1600;
              let w = img.naturalWidth || img.width || 800;
              let h = img.naturalHeight || img.height || 600;
              const needsResize = w > MAX_DIM || h > MAX_DIM || file.size > 2.5 * 1024 * 1024;
              const isSupportedMime = ['image/jpeg', 'image/png', 'image/webp'].includes(file.type);

              if (!needsResize && isSupportedMime) {
                const commaIdx = rawDataUrl.indexOf(',');
                const pureBase64 = commaIdx !== -1 ? rawDataUrl.slice(commaIdx + 1).trim() : rawDataUrl.trim();
                resolve({
                  name: file.name || 'image.png',
                  type: 'image',
                  mimeType: file.type || 'image/png',
                  width: w,
                  height: h,
                  size: file.size,
                  dataUrl: rawDataUrl,
                  base64Data: pureBase64
                });
                return;
              }

              if (w > MAX_DIM || h > MAX_DIM) {
                if (w > h) {
                  h = Math.round((h * MAX_DIM) / w);
                  w = MAX_DIM;
                } else {
                  w = Math.round((w * MAX_DIM) / h);
                  h = MAX_DIM;
                }
              }

              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);

              const outputMime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
              const normalizedDataUrl = canvas.toDataURL(outputMime, 0.9);
              const commaIdx = normalizedDataUrl.indexOf(',');
              const pureBase64 = commaIdx !== -1 ? normalizedDataUrl.slice(commaIdx + 1).trim() : normalizedDataUrl.trim();

              resolve({
                name: file.name || 'image.jpg',
                type: 'image',
                mimeType: outputMime,
                width: w,
                height: h,
                size: Math.round((pureBase64.length * 3) / 4),
                dataUrl: normalizedDataUrl,
                base64Data: pureBase64
              });
            } catch (err) {
              const commaIdx = rawDataUrl.indexOf(',');
              const pureBase64 = commaIdx !== -1 ? rawDataUrl.slice(commaIdx + 1).trim() : rawDataUrl.trim();
              resolve({
                name: file.name || 'image.png',
                type: 'image',
                mimeType: file.type || 'image/png',
                width: 0,
                height: 0,
                size: file.size,
                dataUrl: rawDataUrl,
                base64Data: pureBase64
              });
            }
          };
          img.onerror = () => {
            const commaIdx = rawDataUrl.indexOf(',');
            const pureBase64 = commaIdx !== -1 ? rawDataUrl.slice(commaIdx + 1).trim() : rawDataUrl.trim();
            resolve({
              name: file.name || 'image.png',
              type: 'image',
              mimeType: file.type || 'image/png',
              width: 0,
              height: 0,
              size: file.size,
              dataUrl: rawDataUrl,
              base64Data: pureBase64
            });
          };
          img.src = rawDataUrl;
        };
        reader.readAsDataURL(file);
      });
    }

    function extractArtifactsFromContent(content) {
      if (!content) return [];
      const fence = "`" + "`" + "`";
      const regex = new RegExp(fence + "([a-zA-Z0-9_-]+)?\\s*\\n([\\s\\S]*?)" + fence, "g");
      const blocks = [];
      let match;
      let index = 0;
      while ((match = regex.exec(content)) !== null) {
        const rawLang = (match[1] || 'code').toLowerCase().trim();
        const code = match[2].trim();
        const isBlenderPython =
          rawLang === 'python' ||
          rawLang === 'py' ||
          code.includes('import bpy') ||
          code.includes('bl_info');
        const isPreviewable =
          !isBlenderPython &&
          (rawLang === 'html' ||
            rawLang === 'svg' ||
            code.includes('<!DOCTYPE html>') ||
            code.includes('<html') ||
            code.includes('<svg'));
        blocks.push({
          id: `artifact-${index++}`,
          language: isBlenderPython ? 'python' : rawLang,
          code,
          isPreviewable,
          isBlenderPython
        });
      }
      return blocks;
    }

        '        props = context.scene.gehihi_tool_props',
        '        box = layout.box()',
        '        box.label(text="Cấu hình thông số:", icon="TOOL_SETTINGS")',
        '        box.prop(props, "rename_prefix")',
        '        box.prop(props, "use_origin_bottom")',
        '        box.prop(props, "use_bevel")',
        '        if props.use_bevel:',
        '            col = box.column(align=True)',
        '            col.prop(props, "bevel_width")',
        '            col.prop(props, "bevel_segments")',
        '        layout.separator()',
        '        row = layout.row(align=True)',
        '        row.scale_y = 1.5',
        '        row.operator("gehihi.execute_main_script", icon="PLAY")',
        '',
        'CLASSES = (',
        '    GEHIHI_PG_Settings,',
        '    GEHIHI_OT_ExecuteMain,',
        '    GEHIHI_PT_MainPanel,',
        ')',
        '',
        'def register():',
        '    for cls in CLASSES:',
        '        try:',
        '            bpy.utils.unregister_class(cls)',
        '        except Exception:',
        '            pass',
        '        bpy.utils.register_class(cls)',
        '    bpy.types.Scene.gehihi_tool_props = bpy.props.PointerProperty(type=GEHIHI_PG_Settings)',
        '',
        'def unregister():',
        '    if hasattr(bpy.types.Scene, "gehihi_tool_props"):',
        '        del bpy.types.Scene.gehihi_tool_props',
        '    for cls in reversed(CLASSES):',
        '        try:',
        '            bpy.utils.unregister_class(cls)',
        '        except Exception:',
        '            pass',
        '',
        'if __name__ == "__main__":',
        '    register()'
      ];
      return lines.join('\n');
    }

    function detectVisualCategoryAndKeyword(visionText, fallbackFileName = '', userPrompt = '') {
      let keyword = '';
      if (visionText) {
        const matchKey =
          visionText.match(/(?:TỪ KHÓA TÌM KIẾM|TÊN PHỤ KIỆN|TÊN SẢN PHẨM|TÊN XE|DÒNG XE|MẪU XE|VẬT THỂ|KEYWORD)\s*[:-]\s*([^\n\r*#]+)/i) ||
          visionText.match(/\*\*([^*]{3,65})\*\*/);
        if (matchKey && matchKey[1]) {
          const cleaned = matchKey[1].replace(/[`"[\]()]/g, '').trim();
          if (cleaned.length >= 2 && cleaned.length <= 75) keyword = cleaned;
        }
      }
      if (!keyword) {
        const cleanName = (fallbackFileName || '').replace(/\.[a-zA-Z0-9]+$/, '').replace(/[_-]+/g, ' ').trim();
        keyword = cleanName.length >= 2 ? cleanName : (userPrompt || 'Sản phẩm trong ảnh').slice(0, 45);
      }
      return { keyword, category: 'accessory' };
    }

        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [activeChat?.messages?.length, isStreaming]);

      const recordRealTokenUsage = ({ inputTokens = 0, outputTokens = 0, provider = selectedModel.provider }) => {
        const inTok = Math.max(0, Number(inputTokens) || 0);
        const outTok = Math.max(0, Number(outputTokens) || 0);
        if (inTok === 0 && outTok === 0) return;
        setTokenWallet((prev) => ({
          ...prev,
          usedInputTokens: prev.usedInputTokens + inTok,
          usedOutputTokens: prev.usedOutputTokens + outTok,
          lastCallTokens: inTok + outTok,
          usedRequestsCount: (prev.usedRequestsCount || 0) + 1,
          providerRequestsUsed: {
            ...(prev.providerRequestsUsed || {}),
            [provider]: ((prev.providerRequestsUsed || {})[provider] || 0) + 1
          }
        }));
      };

      const getProviderKeyList = (provider, cfg = apiConfig) => {
        const splitKeys = (str) =>
          String(str || '')
            .split(/[\n,;]+/)
            .map((s) => s.trim())
            .filter(Boolean);

        let primary = [];
        let backups = [];
        if (provider === 'anthropic') {
          primary = splitKeys(cfg.anthropicKey);
          backups = (cfg.anthropicBackupKeys || []).flatMap(splitKeys);
        } else if (provider === 'gemini') {
          primary = splitKeys(cfg.geminiKey);
          backups = (cfg.geminiBackupKeys || []).flatMap(splitKeys);
        } else if (provider === 'openai') {
          primary = splitKeys(cfg.openaiKey);
          backups = (cfg.openaiBackupKeys || []).flatMap(splitKeys);
        }
        return Array.from(new Set([...primary, ...backups]));
      };

      const maskApiKey = (k) => {
        if (!k || k.length < 10) return k || 'Tích hợp sẵn (Canvas)';
        return `${k.slice(0, 8)}...${k.slice(-4)}`;
      };

      const addBackupKeyForProvider = (provider) => {
        const raw = (newBackupKeyInput[provider] || '').trim();
        if (!raw) return;
        const newKeys = raw.split(/[\n,;]+/).map((s) => s.trim()).filter(Boolean);
        if (!newKeys.length) return;

        setApiConfig((prev) => {
          const primaryField = provider === 'anthropic' ? 'anthropicKey' : provider === 'gemini' ? 'geminiKey' : 'openaiKey';
          const backupField = provider === 'anthropic' ? 'anthropicBackupKeys' : provider === 'gemini' ? 'geminiBackupKeys' : 'openaiBackupKeys';
          const currentPrimary = (prev[primaryField] || '').trim();
          if (!currentPrimary) {
            const [first, ...rest] = newKeys;
            return {
              ...prev,
              [primaryField]: first,
              [backupField]: Array.from(new Set([...(prev[backupField] || []), ...rest]))
            };
          }
          return {
            ...prev,
            [backupField]: Array.from(new Set([...(prev[backupField] || []), ...newKeys]))
          };
        });
        setNewBackupKeyInput((prev) => ({ ...prev, [provider]: '' }));
        showToast(`Đã thêm ${newKeys.length} Key cho ${provider.toUpperCase()}!`);
      };

      const manualRotateKey = (provider) => {
        const allKeys = getProviderKeyList(provider);
        if (allKeys.length < 2) {
          showToast(`Cần ít nhất 2 Key ở mục ${provider.toUpperCase()} để đảo Key!`);
          return;
        }
        const [first, second, ...rest] = allKeys;
        const primaryField = provider === 'anthropic' ? 'anthropicKey' : provider === 'gemini' ? 'geminiKey' : 'openaiKey';
        const backupField = provider === 'anthropic' ? 'anthropicBackupKeys' : provider === 'gemini' ? 'geminiBackupKeys' : 'openaiBackupKeys';
        setApiConfig((prev) => ({
          ...prev,
          [primaryField]: second,
          [backupField]: [...rest, first]
        }));
        showToast(`🔄 Đã đảo sang Key: ${maskApiKey(second)}`);
      };

      const removeKeyFromProviderPool = (provider, targetKey) => {
        setApiConfig((prev) => {
          const allKeys = getProviderKeyList(provider, prev).filter((k) => k !== targetKey);
          const primaryField = provider === 'anthropic' ? 'anthropicKey' : provider === 'gemini' ? 'geminiKey' : 'openaiKey';
          const backupField = provider === 'anthropic' ? 'anthropicBackupKeys' : provider === 'gemini' ? 'geminiBackupKeys' : 'openaiBackupKeys';
          const [newPrimary = '', ...restBackups] = allKeys;
          const nextDead = { ...(prev.deadKeysMap || {}) };
          delete nextDead[targetKey];
          return {
            ...prev,
            [primaryField]: newPrimary,
            [backupField]: restBackups,
            deadKeysMap: nextDead
          };
        });
        showToast(`Đã xóa Key ${maskApiKey(targetKey)} khỏi danh sách`);
      };

      const promoteSpecificKeyToPrimary = (provider, targetKey) => {
        setApiConfig((prev) => {
          const allKeys = getProviderKeyList(provider, prev);
          const remaining = allKeys.filter((k) => k !== targetKey);
          const primaryField = provider === 'anthropic' ? 'anthropicKey' : provider === 'gemini' ? 'geminiKey' : 'openaiKey';
          const backupField = provider === 'anthropic' ? 'anthropicBackupKeys' : provider === 'gemini' ? 'geminiBackupKeys' : 'openaiBackupKeys';
          const nextDead = { ...(prev.deadKeysMap || {}) };
          delete nextDead[targetKey];
          return {
            ...prev,
            [primaryField]: targetKey,
            [backupField]: remaining,
            deadKeysMap: nextDead
          };
        });
        showToast(`⚡ Đã chọn Key ${maskApiKey(targetKey)} làm Key chính!`);
      };

      const markKeyDeadAndPromoteBackup = (provider, failedKey, reason = 'Hết hạn / Lỗi kết nối') => {
        if (!failedKey) return;
        setApiConfig((prev) => {
          const allKeys = getProviderKeyList(provider, prev);
          const nextDeadMap = { ...(prev.deadKeysMap || {}), [failedKey]: reason };
          const aliveKeys = allKeys.filter((k) => k !== failedKey && !nextDeadMap[k]);
          const primaryField = provider === 'anthropic' ? 'anthropicKey' : provider === 'gemini' ? 'geminiKey' : 'openaiKey';
          const backupField = provider === 'anthropic' ? 'anthropicBackupKeys' : provider === 'gemini' ? 'geminiBackupKeys' : 'openaiBackupKeys';

          if (aliveKeys.length > 0) {
            const [newPrimary, ...remaining] = aliveKeys;
            const deadOnes = allKeys.filter((k) => k !== newPrimary && !remaining.includes(k));
            return {
              ...prev,
              [primaryField]: newPrimary,
              [backupField]: [...remaining, ...deadOnes],
              deadKeysMap: nextDeadMap
            };
          }
          return { ...prev, deadKeysMap: nextDeadMap };
        });
      };

      const copyTextSafe = (text, label = 'Nội dung') => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast(`Đã sao chép ${label}!`);
        } catch {
          navigator.clipboard?.writeText(text);
          showToast(`Đã sao chép ${label}!`);
        }
      };

      const downloadCodeAsFile = (code, lang = 'html', customTitle = 'gehihi_script') => {
        const ext = getFileExtensionForLang(lang);
        const safeName = customTitle.toLowerCase().replace(/[^a-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'gehihi_output';
        const filename = `${safeName}.${ext}`;
        const mime = ext === 'html' ? 'text/html;charset=utf-8' : 'text/plain;charset=utf-8';
        const blob = new Blob([code], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`Đã tải xuống file: ${filename}`);
      };

      const buildDynamicSystemPrompt = (intentInfo) => {
        const fence = "`" + "`" + "`";
        const base =
          (apiConfig.systemPrompt || '').trim() +
          "\n\n[QUY TẮC NHÂN DẠNG]:\n" +
          "- Trả lời thẳng vào yêu cầu của người dùng một cách tự nhiên, rõ ràng, chi tiết.";

        const blenderMasterRules =
          apiConfig.enableBlender5MasterPrompt !== false
            ? "\n\n" + (apiConfig.blender5MasterPrompt || DEFAULT_BLENDER_5_MASTER_PROMPT).trim()
            : "";

        if (intentInfo.mode === 'vision-analysis') {
          return (
            base +
            "\n\n[QUY TẮC ĐỌC & PHÂN TÍCH HÌNH ẢNH (GEMINI VISION)]:\n" +
            "- Người dùng đã gửi kèm 1 hoặc nhiều hình ảnh.\n" +
            "- Hãy quan sát kỹ toàn bộ bức ảnh và thực hiện đầy đủ yêu cầu của người dùng.\n" +
            "- Nếu ảnh có chứa văn bản, hóa đơn, tài liệu, code hoặc đề bài: hãy đọc (OCR) chính xác từng chữ/con số và giải quyết hoặc phân tích chi tiết.\n" +
            "- Nếu ảnh là biểu đồ, giao diện UI, sơ đồ hoặc vật thể thực tế: hãy mô tả bố cục, màu sắc, số liệu và nhận xét chuyên sâu." +
            blenderMasterRules
          );
        }
        if (intentInfo.mode === 'visual-search') {
          return (
            base +
            "\n\n[QUY TẮC TÌM KIẾM HÌNH ẢNH & PHỤ KIỆN XE]:\n" +
            "- Hãy quan sát kỹ bức ảnh người dùng tải lên, xác định tên chính xác của phụ kiện / mẫu xe / sản phẩm trong ảnh.\n" +
            "- Mở đầu bằng 2 dòng:\n" +
            "  PHÂN LOẠI: <PHỤ KIỆN XE | XE NGUYÊN CHIẾC | SẢN PHẨM KHÁC>\n" +
            "  TỪ KHÓA TÌM KIẾM: <Tên chính xác nhất của vật thể trong ảnh>\n" +
            "- Sau đó phân tích đặc điểm nhận diện và thông tin chi tiết của sản phẩm trong ảnh."
          );
        }
        if (intentInfo.mode === 'addon-tool') {
          return (
            base +
            blenderMasterRules +
            "\n\n[YÊU CẦU ĐẦU RA BẮT BUỘC CHO BLENDER 5.0]:\n" +
            "- Xuất ra file mã nguồn Python hoàn chỉnh chạy trên Blender 5.0 trong khối " + fence + "python ... " + fence + " (có bl_info với \"blender\": (5, 0, 0), import bpy, PropertyGroup, Operator, Panel trên N-Panel, CLASSES, register(), unregister())."
          );
        }
        if (intentInfo.mode === 'html-code') {
          return (
            base +
            "\n\n[QUY TẮC CODE WEB / GAME HTML5]:\n" +
            "- Xuất ra 1 file HTML hoàn chỉnh duy nhất trong khối " + fence + "html ... " + fence + " để chạy thử trực tiếp."
          );
        }
        return base + blenderMasterRules;
      };

      const extractCleanGeminiInlineData = (att) => {
        if (!att || att.type !== 'image') return null;
        let pureBase64 = (att.base64Data || '').trim();
        let mimeType = (att.mimeType || 'image/jpeg').trim();

        if (pureBase64.includes(',')) {
          const [header, b64] = pureBase64.split(',');
          pureBase64 = (b64 || '').trim();
          const mimeMatch = header.match(/data:([^;]+);base64/i);
          if (mimeMatch && mimeMatch[1]) mimeType = mimeMatch[1];
        } else if (!pureBase64 && att.dataUrl && att.dataUrl.includes(',')) {
          const [header, b64] = att.dataUrl.split(',');
          pureBase64 = (b64 || '').trim();
          const mimeMatch = header.match(/data:([^;]+);base64/i);
          if (mimeMatch && mimeMatch[1]) mimeType = mimeMatch[1];
        }

        if (!pureBase64) return null;
        if (!['image/jpeg', 'image/png', 'image/webp', 'image/heic', 'image/heif'].includes(mimeType)) {
          mimeType = 'image/jpeg';
        }
        return { mimeType, data: pureBase64 };
      };

      const buildGeminiMultimodalContents = (historyMessages, currentText, currentAttachments) => {
        const contents = [];
        const recentHistory = (historyMessages || []).filter((m) => !m.isStreaming).slice(-6);
        for (const msg of recentHistory) {
          const role = msg.role === 'assistant' ? 'model' : 'user';
          const parts = [];

          if (Array.isArray(msg.attachments)) {
            for (const att of msg.attachments) {
              const inlineObj = extractCleanGeminiInlineData(att);
              if (inlineObj) {
                parts.push({ inlineData: inlineObj });
              } else if (att.textContent) {
                parts.push({ text: `\n--- Tệp (${att.name}) ---\n${att.textContent}\n` });
              }
            }
          }

          const cleanText = String(msg.content || '').trim();
          if (cleanText) {
            parts.push({ text: cleanText });
          }

          if (parts.length > 0) {
            if (contents.length > 0 && contents[contents.length - 1].role === role) {
              contents[contents.length - 1].parts.push(...parts);
            } else {
              contents.push({ role, parts });
            }
          }
        }

        while (contents.length > 0 && contents[0].role !== 'user') {
          contents.shift();
        }

        const currentParts = [];
        const promptToSend =
          currentText && currentText.trim() !== ''
            ? currentText.trim()
            : 'Hãy đọc và phân tích chi tiết hình ảnh này.';

        currentParts.push({ text: promptToSend });

        const debugImagesMeta = [];
        for (const att of currentAttachments || []) {
          if (att.type === 'image') {
            const inlineObj = extractCleanGeminiInlineData(att);
            if (inlineObj) {
              currentParts.push({
                inlineData: {
                  mimeType: inlineObj.mimeType,
                  data: inlineObj.data
                }
              });
              debugImagesMeta.push({
                name: att.name,
                mimeType: inlineObj.mimeType,
                dimensions: att.width && att.height ? `${att.width}x${att.height}px` : 'Auto',
                base64Length: inlineObj.data.length,
                base64Preview: `${inlineObj.data.slice(0, 36)}...${inlineObj.data.slice(-20)}`
              });
            }
          } else if (att.textContent) {
            currentParts.push({
              text: `\n--- Nội dung tệp đính kèm (${att.name}) ---\n${att.textContent}\n`
            });
          }
        }

        if (contents.length > 0 && contents[contents.length - 1].role === 'user') {
          contents[contents.length - 1].parts.push(...currentParts);
        } else {
          contents.push({ role: 'user', parts: currentParts });
        }

        return { contents, debugImagesMeta };
      };

      const callGeminiWithVisionSupport = async ({
        apiKey = '',
        model = 'gemini-3-flash-preview',
        historyMessages,
        currentText,
        currentAttachments,
        intentInfo,
        onDelta,
        onThinkingDelta,
        signal
      }) => {
        const cleanKey = (apiKey || '').trim();
        const sysPrompt = buildDynamicSystemPrompt(intentInfo);
        const { contents, debugImagesMeta } = buildGeminiMultimodalContents(
          historyMessages,
          currentText,
          currentAttachments
        );

        const sanitizedContentsForDebug = contents.map((turn) => ({
          role: turn.role,
          parts: turn.parts.map((p) =>
            p.inlineData
              ? {
                  inlineData: {
                    mimeType: p.inlineData.mimeType,
                    data: `${p.inlineData.data.slice(0, 48)}... [Chuỗi Base64 thuần dài ${p.inlineData.data.length.toLocaleString()} ký tự]`
                  }
                }
              : p
          )
        }));

        const candidateModels = cleanKey
          ? Array.from(new Set([model, 'gemini-2.5-flash', 'gemini-3-flash-preview', 'gemini-2.0-flash']))
          : ['gemini-3-flash-preview'];

        setLastVisionPayloadDebug({
          endpoint: `https://generativelanguage.googleapis.com/v1beta/models/${candidateModels[0]}:generateContent`,
          model: candidateModels[0],
          usedBuiltInRuntimeKey: !cleanKey,
          imageCount: debugImagesMeta.length,
          imagesMeta: debugImagesMeta,
          payloadPreview: {
            contents: sanitizedContentsForDebug,
            systemInstruction: { parts: [{ text: sysPrompt }] }
          }
        });

        if (debugImagesMeta.length > 0 && onThinkingDelta) {
          onThinkingDelta(
            `Đã đóng gói ${debugImagesMeta.length} hình ảnh sang chuẩn Gemini inlineData (${debugImagesMeta
              .map((m) => `${m.name} · ${m.mimeType}`)
              .join(', ')}).\nĐang gửi tới Gemini Vision API...`
          );
        }

        const payload = {
          contents,
          systemInstruction: {
            parts: [{ text: sysPrompt }]
          }
        };

        let lastError = null;

        for (const targetModel of candidateModels) {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${cleanKey}`;
          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
              signal
            });

            if (response.ok) {
              const result = await response.json();
              const parts = result?.candidates?.[0]?.content?.parts || [];
              const fullText = parts.map((p) => p.text || '').join('');
              if (fullText.trim()) {
                onDelta(fullText);
                recordRealTokenUsage({
                  inputTokens: result?.usageMetadata?.promptTokenCount || 220,
                  outputTokens: result?.usageMetadata?.candidatesTokenCount || Math.ceil(fullText.length / 4)
                });
                return;
              }
            } else {
              const errJson = await response.json().catch(() => ({}));
              const errMsg = errJson?.error?.message || `Gemini HTTP ${response.status}`;
              lastError = new Error(errMsg);
              if (response.status === 400 || response.status === 403) {
                break;
              }
            }
          } catch (err) {
            if (err.name === 'AbortError') throw err;
            lastError = err;
          }
        }

        try {
          const imageAtts = (currentAttachments || []).filter((a) => a.type === 'image' && a.dataUrl);
          let userMsgContent = currentText;
          if (imageAtts.length > 0) {
            userMsgContent = [
              {
                type: 'text',
                text: (currentText || 'Hãy phân tích hình ảnh này.') + '\n[Ghi chú: Đã đính kèm hình ảnh để phân tích chi tiết]'
              },
              ...imageAtts.map((img) => ({ type: 'image_url', image_url: { url: img.dataUrl } }))
            ];
          }

          const proxyRes = await fetch('https://text.pollinations.ai/openai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'openai',
              messages: [
                { role: 'system', content: sysPrompt },
                { role: 'user', content: userMsgContent }
              ],
              temperature: Number(apiConfig.temperature) || 0.7
            }),
            signal
          });

          if (proxyRes.ok) {
            const proxyData = await proxyRes.json();
            const proxyText = proxyData?.choices?.[0]?.message?.content || '';
            if (proxyText && proxyText.trim().length > 3) {
              onDelta(proxyText);
              recordRealTokenUsage({ inputTokens: 180, outputTokens: Math.ceil(proxyText.length / 4) });
              return;
            }
          }
        } catch (proxyErr) {
          if (proxyErr.name === 'AbortError') throw proxyErr;
        }

        throw lastError || new Error('API key not valid hoặc không thể kết nối tới máy chủ AI.');
      };

      const streamWithSingleOpenAIKey = async ({ apiKey, model, historyMessages, currentText, currentAttachments, intentInfo, onDelta, signal }) => {
        const cleanKey = apiKey.trim();
        const baseUrl = (apiConfig.openaiBaseUrl || 'https://api.openai.com/v1').replace(/\/+$/, '');
        const endpoint = baseUrl.endsWith('/chat/completions') ? baseUrl : `${baseUrl}/chat/completions`;
        const sysPrompt = buildDynamicSystemPrompt(intentInfo);

        const userParts = [{ type: 'text', text: currentText || 'Hãy đọc và phân tích chi tiết hình ảnh này.' }];
        for (const att of currentAttachments || []) {
          if (att.type === 'image' && att.dataUrl) {
            userParts.push({
              type: 'image_url',
              image_url: { url: att.dataUrl, detail: 'high' }
            });
          } else if (att.textContent) {
            userParts.push({
              type: 'text',
              text: `\n--- Tệp (${att.name}) ---\n${att.textContent}\n`
            });
          }
        }

        const apiMessages = [{ role: 'system', content: sysPrompt }];
        for (const msg of (historyMessages || []).slice(-6)) {
          if (!msg.content || msg.isStreaming) continue;
          apiMessages.push({
            role: msg.role === 'assistant' ? 'assistant' : 'user',
            content: String(msg.content)
          });
        }
        apiMessages.push({
          role: 'user',
          content: userParts.length === 1 ? (currentText || 'Xin chào') : userParts
        });

        const syncRes = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${cleanKey}`
          },
          body: JSON.stringify({
            model: model || 'gpt-4o',
            messages: apiMessages,
            max_tokens: Number(apiConfig.maxTokens) || 4096
          }),
          signal
        });

        if (!syncRes.ok) throw new Error(`OpenAI HTTP ${syncRes.status}`);
        const data = await syncRes.json();
        const replyText = data?.choices?.[0]?.message?.content || '';
        if (!replyText.trim()) throw new Error('OpenAI phản hồi rỗng');
        onDelta(replyText);
        recordRealTokenUsage({
          inputTokens: data?.usage?.prompt_tokens || 160,
          outputTokens: data?.usage?.completion_tokens || Math.ceil(replyText.length / 4)
        });
      };

      const streamWithSingleClaudeKey = async ({ apiKey, model, historyMessages, currentText, currentAttachments, intentInfo, onDelta, signal }) => {
        const cleanKey = apiKey.trim();
        const baseUrl = (apiConfig.claudeBaseUrl || 'https://api.anthropic.com').replace(/\/+$/, '');
        const sysPrompt = buildDynamicSystemPrompt(intentInfo);
        const messagesUrl = baseUrl.endsWith('/v1') ? `${baseUrl}/messages` : `${baseUrl}/v1/messages`;

        const userBlocks = [];
        for (const att of currentAttachments || []) {
          const inlineObj = extractCleanGeminiInlineData(att);
          if (inlineObj) {
            userBlocks.push({
              type: 'image',
              source: { type: 'base64', media_type: inlineObj.mimeType, data: inlineObj.data }
            });
          }
        }
        userBlocks.push({
          type: 'text',
          text: currentText || 'Hãy đọc và phân tích chi tiết hình ảnh này.'
        });

        const res = await fetch(messagesUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': cleanKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: model || 'claude-sonnet-4-5-20250929',
            max_tokens: Number(apiConfig.maxTokens) || 4096,
            system: sysPrompt,
            messages: [{ role: 'user', content: userBlocks }]
          }),
          signal
        });

        if (!res.ok) throw new Error(`Claude HTTP ${res.status}`);
        const data = await res.json();
        const text = (data?.content || []).map((c) => c.text || '').join('');
        if (!text.trim()) throw new Error('Claude phản hồi rỗng');
        onDelta(text);
        recordRealTokenUsage({ inputTokens: 180, outputTokens: Math.ceil(text.length / 4) });
      };

      const executeProviderWithKeyPool = async ({
        provider,
        model,
        historyMessages,
        currentText,
        currentAttachments,
        intentInfo,
        onDelta,
        onThinkingDelta,
        onSwapEvent,
        signal
      }) => {
        const allKeys = getProviderKeyList(provider);
        const deadMap = apiConfig.deadKeysMap || {};
        const orderedKeys = [
          ...allKeys.filter((k) => !deadMap[k]),
          ...allKeys.filter((k) => deadMap[k])
        ];

        if (provider === 'gemini' && orderedKeys.length === 0) {
          await callGeminiWithVisionSupport({
            apiKey: '',
            model: 'gemini-3-flash-preview',
            historyMessages,
            currentText,
            currentAttachments,
            intentInfo,
            onDelta,
            onThinkingDelta,
            signal
          });
          return { usedProvider: 'gemini', usedKey: '', swapped: false };
        }

        if (orderedKeys.length === 0) {
          throw new Error(`Chưa nhập API Key cho ${provider.toUpperCase()}`);
        }

        let lastErr = null;
        const maxAttempts = apiConfig.autoSwapSameProvider ? orderedKeys.length : 1;

        for (let idx = 0; idx < maxAttempts; idx++) {
          const candidateKey = orderedKeys[idx];
          try {
            if (provider === 'gemini') {
              await callGeminiWithVisionSupport({
                apiKey: candidateKey,
                model,
                historyMessages,
                currentText,
                currentAttachments,
                intentInfo,
                onDelta,
                onThinkingDelta,
                signal
              });
            } else if (provider === 'anthropic') {
              await streamWithSingleClaudeKey({
                apiKey: candidateKey,
                model,
                historyMessages,
                currentText,
                currentAttachments,
                intentInfo,
                onDelta,
                signal
              });
            } else if (provider === 'openai') {
              await streamWithSingleOpenAIKey({
                apiKey: candidateKey,
                model,
                historyMessages,
                currentText,
                currentAttachments,
                intentInfo,
                onDelta,
                signal
              });
            }
            return { usedProvider: provider, usedKey: candidateKey, swapped: idx > 0 };
          } catch (err) {
            if (err.name === 'AbortError') throw err;
            lastErr = err;
            markKeyDeadAndPromoteBackup(provider, candidateKey, err.message || 'Lỗi kết nối / Hết hạn');
            if (idx + 1 < maxAttempts) {
              const nextKey = orderedKeys[idx + 1];
              const notice = `🔄 Key ${maskApiKey(candidateKey)} lỗi, tự động đảo sang Key dự phòng ${maskApiKey(nextKey)}`;
              onSwapEvent?.(notice);
              showToast(notice);
            }
          }
        }

        if (provider === 'gemini') {
          await callGeminiWithVisionSupport({
            apiKey: '',
            model: 'gemini-3-flash-preview',
            historyMessages,
            currentText,
            currentAttachments,
            intentInfo,
            onDelta,
            onThinkingDelta,
            signal
          });
          return { usedProvider: 'gemini', usedKey: '', swapped: true };
        }

        throw lastErr || new Error(`${provider.toUpperCase()} không khả dụng`);
      };

      const handleSendMessage = async (overrideAttachments = null, overridePrompt = null) => {
        const activeAtts = overrideAttachments !== null ? overrideAttachments : attachments;
        const rawText = overridePrompt !== null ? overridePrompt : promptText;
        const trimmedPrompt = rawText.trim();

        if ((!trimmedPrompt && activeAtts.length === 0) || isStreaming) return;

        const currentAttachments = [...activeAtts];
        const hasImageAtt = currentAttachments.some((a) => a.type === 'image');
        const intentInfo = detectUserPromptIntent(trimmedPrompt, forcedOutputMode, hasImageAtt);

        const effectivePrompt =
          hasImageAtt && !trimmedPrompt
            ? intentInfo.mode === 'visual-search'
              ? 'Hãy nhận diện chính xác sản phẩm / phụ kiện xe trong bức ảnh này và tìm các đường link liên quan.'
              : 'Hãy đọc và phân tích chi tiết hình ảnh này.'
            : trimmedPrompt;

        const userMsg = {
          id: 'user-' + Date.now(),
          role: 'user',
          content: effectivePrompt,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          attachments: currentAttachments,
          intentBadge: intentInfo.label
        };

        const assistantMsgId = 'asst-' + (Date.now() + 1);
        const placeholderAssistantMsg = {
          id: assistantMsgId,
          role: 'assistant',
          provider: selectedModel.provider,
          thinkingPresetLabel: activeThinkingPreset.label,
          thinkingText: '',
          content: '',
          visualSearchData: null,
          analyzedImageCount: currentAttachments.filter((a) => a.type === 'image').length,
          swapNotice: null,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          isStreaming: true
        };

        let targetChatId = activeChatId;
        let historyForApi = [];

        if (!targetChatId) {
          targetChatId = 'chat-' + Date.now();
          const newChat = {
            id: targetChatId,
            title: (effectivePrompt || currentAttachments[0]?.name || 'Phân tích hình ảnh').slice(0, 42),
            pinned: false,
            updatedAt: new Date().toISOString(),
            modelId: selectedModel.id,
            messages: [userMsg, placeholderAssistantMsg]
          };
          setChats((prev) => [newChat, ...prev]);
          setActiveChatId(targetChatId);
        } else {
          const existing = chats.find((c) => c.id === targetChatId);
          historyForApi = existing ? existing.messages : [];
          setChats((prev) =>
            prev.map((c) =>
              c.id === targetChatId
                ? { ...c, updatedAt: new Date().toISOString(), messages: [...c.messages, userMsg, placeholderAssistantMsg] }
                : c
            )
          );
        }

        if (overridePrompt === null) setPromptText('');
        if (overrideAttachments === null) setAttachments([]);
        setIsStreaming(true);

        const controller = new AbortController();
        abortControllerRef.current = controller;

        let accumulatedContent = '';
        let accumulatedThinking = '';

        const appendDelta = (deltaText) => {
          accumulatedContent += deltaText;
          setChats((prev) =>
            prev.map((c) =>
              c.id === targetChatId
                ? {
                    ...c,
                    messages: c.messages.map((m) =>
                      m.id === assistantMsgId ? { ...m, content: accumulatedContent } : m
                    )
                  }
                : c
            )
          );
        };

        const appendThinkingDelta = (thinkDelta) => {
          accumulatedThinking += thinkDelta;
          setChats((prev) =>
            prev.map((c) =>
              c.id === targetChatId
                ? {
                    ...c,
                    messages: c.messages.map((m) =>
                      m.id === assistantMsgId ? { ...m, thinkingText: accumulatedThinking } : m
                    )
                  }
                : c
            )
          );
        };

        const setAssistantSwapNotice = (noticeStr) => {
          setChats((prev) =>
            prev.map((c) =>
              c.id === targetChatId
                ? {
                    ...c,
                    messages: c.messages.map((m) =>
                      m.id === assistantMsgId ? { ...m, swapNotice: noticeStr } : m
                    )
                  }
                : c
            )
          );
        };

        try {
          const primaryProvider = selectedModel.provider;
          let succeeded = false;

          try {
            await executeProviderWithKeyPool({
              provider: primaryProvider,
              model: selectedModel.apiModel,
              historyMessages: historyForApi,
              currentText: userMsg.content,
              currentAttachments,
              intentInfo,
              onDelta: appendDelta,
              onThinkingDelta: appendThinkingDelta,
              onSwapEvent: setAssistantSwapNotice,
              signal: controller.signal
            });
            succeeded = accumulatedContent.trim().length > 0;
          } catch (primaryErr) {
            if (primaryErr.name === 'AbortError') throw primaryErr;
          }

          if (!succeeded) {
            if (primaryProvider !== 'gemini') {
              setAssistantSwapNotice(
                `🔄 Chuyển sang Gemini Vision (${hasImageAtt ? 'Đọc ảnh inlineData' : 'Phản hồi AI'}) do ${primaryProvider.toUpperCase()} chưa có Key hợp lệ`
              );
            }
            await callGeminiWithVisionSupport({
              apiKey: apiConfig.geminiKey || '',
              model: 'gemini-3-flash-preview',
              historyMessages: historyForApi,
              currentText: userMsg.content,
              currentAttachments,
              intentInfo,
              onDelta: appendDelta,
              onThinkingDelta: appendThinkingDelta,
              signal: controller.signal
            });
            succeeded = accumulatedContent.trim().length > 0;
          }
        } catch (err) {
          if (err.name !== 'AbortError' && !accumulatedContent.trim()) {
            appendDelta(
              `⚠️ Không thể hoàn tất yêu cầu tới API (${err.message || 'Lỗi kết nối'}). Bạn có thể kiểm tra lại API Key trong mục **API & Swap** hoặc bấm nút **Debug Payload** ở thanh công cụ phía trên để kiểm tra dữ liệu ảnh.`
            );
          }
        } finally {
          const fence = "`" + "`" + "`";
          if (intentInfo.mode === 'addon-tool' && intentInfo.isBlender) {
            const blocks = extractArtifactsFromContent(accumulatedContent);
            if (!blocks.some((b) => b.isBlenderPython)) {
              const guaranteedPy = synthesizeBlenderPythonScript(userMsg.content, 'Gehihi');
              appendDelta("\n\n### 🐍 File Blender Python Scripting (`.py`) hoàn chỉnh:\n" + fence + "python\n" + guaranteedPy + "\n" + fence);
            }
          }

          if (intentInfo.mode === 'html-code') {
            const blocks = extractArtifactsFromContent(accumulatedContent);
            if (!blocks.some((b) => b.isPreviewable)) {
              const guaranteedHtml = synthesizeTailoredHtmlCode(userMsg.content);
              appendDelta("\n\n" + fence + "html\n" + guaranteedHtml + "\n" + fence);
            }
          }

          let generatedVisualData = null;
          if (intentInfo.mode === 'visual-search') {
            try {
              const firstImgName = currentAttachments.find((a) => a.type === 'image')?.name || '';
              const { keyword: extractedKeyword } = detectVisualCategoryAndKeyword(
                accumulatedContent,
                firstImgName,
                trimmedPrompt
              );
              if (extractedKeyword) {
                generatedVisualData = await fetchRelatedImagesAndVideosByKeyword(extractedKeyword);
              }
            } catch {}
          }

          setIsStreaming(false);
          setChats((prev) =>
            prev.map((c) =>
              c.id === targetChatId
                ? {
                    ...c,
                    messages: c.messages.map((m) =>
                      m.id === assistantMsgId
                        ? { ...m, isStreaming: false, visualSearchData: generatedVisualData || m.visualSearchData }
                        : m
                    )
                  }
                : c
            )
          );

          const extracted = extractArtifactsFromContent(accumulatedContent);
          if (intentInfo.mode === 'addon-tool') {
            const pyBlock = extracted.find((b) => b.isBlenderPython) || extracted[0];
            if (pyBlock) {
              setArtifactPanel({
                isOpen: true,
                title: '🐍 Blender Python Script (.PY)',
                code: pyBlock.code,
                language: pyBlock.language || 'python',
                activeTab: 'code',
                isFullscreen: false,
                refreshKey: Date.now()
              });
            }
          } else if (intentInfo.mode === 'html-code') {
            const htmlBlock = extracted.find((b) => b.isPreviewable);
            if (htmlBlock) {
              setArtifactPanel({
                isOpen: true,
                title: '⚡ Chạy thử HTML (Live Preview)',
                code: htmlBlock.code,
                language: 'html',
                activeTab: 'preview',
                isFullscreen: false,
                refreshKey: Date.now()
              });
            }
          }
        }
      };

      const processFiles = async (fileList) => {
        const filesArray = Array.from(fileList || []);
        if (!filesArray.length) return;
        const newAttachments = [];
        for (const file of filesArray) {
          const isImage = file.type.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp)$/i.test(file.name);
          const id = `att-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
          if (isImage) {
            try {
              const normalizedImg = await normalizeImageFileForGemini(file);
              newAttachments.push({ ...normalizedImg, id });
            } catch (e) {
              showToast(`Lỗi đọc ảnh ${file.name}`);
            }
          } else {
            const textContent = await new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = () => resolve(String(reader.result || ''));
              reader.onerror = () => resolve(`[Tệp: ${file.name}]`);
              reader.readAsText(file);
            });
            newAttachments.push({
              id,
              name: file.name,
              type: 'file',
              mimeType: file.type || 'text/plain',
              size: file.size,
              textContent: textContent.slice(0, 50000)
            });
          }
        }
        setAttachments((prev) => [...prev, ...newAttachments]);
        const imgCount = newAttachments.filter((a) => a.type === 'image').length;
        if (imgCount > 0) {
          showToast(`👁️ Đã chuẩn hóa ${imgCount} ảnh (inlineData) sẵn sàng cho Gemini Vision!`);
        } else {
          showToast(`Đã đính kèm ${newAttachments.length} tệp tin`);
        }
      };

      const handlePaste = (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        const files = [];
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf('image') !== -1) {
            const file = items[i].getAsFile();
            if (file) files.push(file);
          }
        }
        if (files.length > 0) {
          e.preventDefault();
          processFiles(files);
        }
      };

      const handleAttachSampleVisionImage = (autoSend = false) => {
        const sampleAtt = createSampleVisionTestAttachment();
        const samplePrompt =
          'Hãy đọc toàn bộ nội dung văn bản, mã đơn hàng, thông số kỹ thuật, công thức và số liệu biểu đồ trong bức ảnh báo cáo này rồi phân tích chi tiết.';
        if (autoSend) {
          handleSendMessage([sampleAtt], samplePrompt);
        } else {
          setAttachments((prev) => [...prev, sampleAtt]);
          if (!promptText.trim()) setPromptText(samplePrompt);
          showToast('👁️ Đã tạo ảnh mẫu kiểm thử Vision! Bấm Gửi để Gemini đọc ảnh ngay.');
          textareaRef.current?.focus();
        }
      };

      const toggleVoiceRecording = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showToast('Trình duyệt chưa hỗ trợ nhận diện giọng nói.');
          return;
        }
        if (isRecording) {
          recognitionRef.current?.stop();
          setIsRecording(false);
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'vi-VN';
        recognition.onstart = () => {
          setIsRecording(true);
          showToast('Đang lắng nghe giọng nói...');
        };
        recognition.onresult = (event) => {
          const transcript = event.results?.[0]?.[0]?.transcript || '';
          if (transcript) setPromptText((prev) => (prev ? `${prev.trim()} ${transcript}` : transcript));
        };
        recognition.onerror = () => setIsRecording(false);
        recognition.onend = () => setIsRecording(false);
        recognitionRef.current = recognition;
        recognition.start();
      };

      const renderMessageContent = (content) => {
        if (!content) return null;
        const fence = "`" + "`" + "`";
        const splitRegex = new RegExp("(" + fence + "[\\s\\S]*?" + fence + ")", "g");
        const parts = content.split(splitRegex);
        return parts.map((part, index) => {
          if (part.startsWith(fence) && part.endsWith(fence)) {
            const firstNewLine = part.indexOf('\n');
            const rawLang = firstNewLine !== -1 ? part.slice(3, firstNewLine).trim() || 'code' : 'code';
            const code = firstNewLine !== -1 ? part.slice(firstNewLine + 1, -3).trim() : part.slice(3, -3).trim();
            const isBlenderPy =
              rawLang.toLowerCase() === 'python' ||
              rawLang.toLowerCase() === 'py' ||
              code.includes('import bpy') ||
              code.includes('bl_info');
            const isPreviewable =
              !isBlenderPy &&
              (rawLang.toLowerCase() === 'html' ||
                rawLang.toLowerCase() === 'svg' ||
                code.includes('<!DOCTYPE html>') ||
                code.includes('<html'));
            const ext = getFileExtensionForLang(isBlenderPy ? 'python' : rawLang);
            const blockId = `code-${index}-${code.length}`;

            return (
              <div key={index} className="my-3.5 rounded-2xl overflow-hidden border border-red-200/80 bg-[#18181B] shadow-md">
                <div className="flex items-center justify-between px-4 py-2.5 bg-[#241919] border-b border-red-950/60 text-xs text-neutral-200 flex-wrap gap-2">
                  <div className="flex items-center gap-2">
                    <Code2 className="w-3.5 h-3.5 text-red-400" />
                    <span className="font-mono uppercase tracking-wider text-[11px] text-red-200 font-semibold">
                      {isBlenderPy ? 'PYTHON (BLENDER SCRIPTING .PY)' : rawLang}
                    </span>
                  </div>
                  <div className="flex items-center gap-1.5 flex-wrap">
                    {isPreviewable && (
                      <button
                        onClick={() =>
                          setArtifactPanel({
                            isOpen: true,
                            title: '⚡ Chạy thử HTML (Artifacts)',
                            code,
                            language: 'html',
                            activeTab: 'preview',
                            isFullscreen: false,
                            refreshKey: Date.now()
                          })
                        }
                        className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-600 hover:bg-red-500 text-white font-semibold transition shadow-xs"
                      >
                        <Play className="w-3 h-3" />
                        <span>Chạy thử trong Artifacts</span>
                      </button>
                    )}
                    <button
                      onClick={() => downloadCodeAsFile(code, isBlenderPy ? 'python' : rawLang, isBlenderPy ? 'gehihi_blender_addon' : 'gehihi_webapp')}
                      className="flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold transition"
                    >
                      <Download className="w-3 h-3" />
                      <span>Tải file .{ext.toUpperCase()}</span>
                    </button>
                    <button
                      onClick={() => {
                        copyTextSafe(code, 'Mã nguồn');
                        setCopiedId(blockId);
                        setTimeout(() => setCopiedId(null), 1800);
                      }}
                      className="flex items-center gap-1 px-2.5 py-1 rounded-full hover:bg-white/10 text-neutral-200 transition"
                    >
                      {copiedId === blockId ? (
                        <>
                          <Check className="w-3.5 h-3.5 text-emerald-400" />
                          <span className="text-emerald-400">Đã chép</span>
                        </>
                      ) : (
                        <>
                          <Copy className="w-3.5 h-3.5" />
                          <span>Copy</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>
                <pre className="p-4 text-xs font-mono text-neutral-100 overflow-x-auto max-h-96 leading-relaxed select-text">
                  <code>{code}</code>
                </pre>
              </div>
            );
          }

          return (
            <div key={index} className={"space-y-2 leading-relaxed text-[15px] " + (isLight ? "text-zinc-800" : "text-[#ECECEC]")}>
              {part.split('\n').map((line, lIdx) => {
                if (!line.trim()) return <div key={lIdx} className="h-1" />;
                if (line.startsWith('### ')) {
                  return <h3 key={lIdx} className="text-base font-bold text-red-600 mt-3">{line.slice(4)}</h3>;
                }
                if (line.startsWith('## ')) {
                  return <h2 key={lIdx} className="text-lg font-bold text-red-600 mt-3">{line.slice(3)}</h2>;
                }
                if (line.startsWith('> ')) {
                  return (
                    <blockquote key={lIdx} className={"border-l-4 border-red-600 pl-3.5 py-1.5 my-2 rounded-r-xl text-sm " + (isLight ? "bg-red-50/80 text-zinc-700" : "bg-[#261919] text-neutral-200")}>
                      {line.slice(2)}
                    </blockquote>
                  );
                }
                const formatted = line
                  .split(/(\[[^\]]+\]\(https?:\/\/[^\s)]+\)|https?:\/\/[^\s)<]+|\*\*.*?\*\*|`.*?`)/g)
                  .map((seg, sIdx) => {
                    if (!seg) return null;
                    const mdLinkMatch = seg.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/);
                    if (mdLinkMatch) {
                      return (
                        <a
                          key={sIdx}
                          href={mdLinkMatch[2]}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="inline-flex items-center gap-1 font-semibold text-red-600 underline hover:text-red-700 break-all"
                        >
                          <span>{mdLinkMatch[1]}</span>
                          <ExternalLink className="w-3 h-3 inline shrink-0" />
                        </a>
                      );
                    }
                    if (/^https?:\/\/[^\s)<]+$/.test(seg)) {
                      return (
                        <a
                          key={sIdx}
                          href={seg}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="inline-flex items-center gap-1 font-mono text-xs text-blue-600 underline hover:text-blue-700 break-all"
                        >
                          <span>{seg}</span>
                          <ExternalLink className="w-3 h-3 inline shrink-0" />
                        </a>
                      );
                    }
                    if (seg.startsWith('**') && seg.endsWith('**')) {
                      return <strong key={sIdx} className="font-semibold">{seg.slice(2, -2)}</strong>;
                    }
                    if (seg.startsWith('`') && seg.endsWith('`')) {
                      return <code key={sIdx} className="px-1.5 py-0.5 rounded font-mono text-[13px] bg-red-50 text-red-700 border border-red-200/60">{seg.slice(1, -1)}</code>;
                    }
                    return seg;
                  });
                return <p key={lIdx}>{formatted}</p>;
              })}
            </div>
          );
        });
      };

      const totalUsedTokens = tokenWallet.usedInputTokens + tokenWallet.usedOutputTokens;
      const remainingTokens = Math.max(0, tokenWallet.purchasedTokens - totalUsedTokens);
      const remainingPercent =
        tokenWallet.purchasedTokens > 0
          ? Math.min(100, Math.max(0, (remainingTokens / tokenWallet.purchasedTokens) * 100))
          : 0;

      const totalRequestsLimit = Math.max(1, Number(tokenWallet.totalRequestsLimit) || 1500);
      const usedRequestsCount = Math.max(0, Number(tokenWallet.usedRequestsCount) || 0);
      const remainingRequestsCount = Math.max(0, totalRequestsLimit - usedRequestsCount);
      const remainingRequestsPercent = Math.min(
        100,
        Math.max(0, (remainingRequestsCount / totalRequestsLimit) * 100)
      );

      const activeProviderKeys = getProviderKeyList(selectedModel.provider);
      const activeKeyStatusLabel =
        activeProviderKeys.length > 0
          ? `Key #1 (${maskApiKey(activeProviderKeys[0])})`
          : selectedModel.provider === 'gemini'
          ? 'Gemini Vision (Mặc định)'
          : `${selectedModel.provider.toUpperCase()} API`;

      return (
        <div
          className={`flex h-screen w-screen overflow-hidden select-none transition-colors duration-300 ${
            isLight ? 'bg-[#FCFBF9] text-[#18181B]' : 'bg-[#141111] text-[#F5F3F3]'
          }`}
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => {
            e.preventDefault();
            if (e.dataTransfer?.files?.length) processFiles(e.dataTransfer.files);
          }}
        >
          {toastMessage && (
            <div className="fixed top-4 right-4 z-50 flex items-center gap-2.5 px-4 py-2.5 rounded-2xl border bg-white border-red-200 text-zinc-900 text-sm font-medium shadow-xl">
              <CheckCircle2 className="w-4 h-4 text-red-600 shrink-0" />
              <span>{toastMessage}</span>
            </div>
          )}

          <aside
            className={`${
              sidebarOpen ? 'w-[258px]' : 'w-0'
            } shrink-0 h-full border-r flex flex-col transition-all duration-200 overflow-hidden ${
              isLight ? 'bg-[#F6F2F0] border-[#ECE2DF]' : 'bg-[#1B1616] border-[#2D2323]'
            }`}
          >
            <div className="flex items-center justify-between px-3.5 pt-4 pb-3 gap-1.5">
              <div className="flex items-center gap-2 min-w-0">
                <button
                  onClick={() => setSidebarOpen(false)}

                      }}
                      className="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-xs font-semibold"
                    >
                      Lưu hạn mức
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {showPasswordModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-xs p-4" onClick={() => setShowPasswordModal(false)}>
              <form
                onSubmit={handleVerifyAdminPassword}
                className="w-full max-w-sm rounded-2xl bg-[#1C1C1A] border border-amber-500/40 shadow-2xl p-6 space-y-4"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center justify-between border-b border-[#2C2C29] pb-3">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-full bg-amber-500/20 border border-amber-400/50 flex items-center justify-center text-amber-400">
                      <Lock className="w-4 h-4" />
                    </div>
                    <div>
                      <h2 className="text-sm font-bold text-white">Xác thực Quản trị viên</h2>
                      <p className="text-[11px] text-neutral-400">Nhập mật khẩu để mở cấu hình API & Swap</p>
                    </div>
                  </div>
                  <button type="button" onClick={() => setShowPasswordModal(false)} className="text-neutral-400 hover:text-white">
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-2">
                  <label className="block text-xs font-semibold text-neutral-300">
                    Mật khẩu bảo mật:
                  </label>
                  <div className="relative">
                    <input
                      type={showPasswordChars ? 'text' : 'password'}
                      autoFocus
                      value={passwordInput}
                      onChange={(e) => {
                        setPasswordInput(e.target.value);
                        if (passwordError) setPasswordError('');
                      }}
                      placeholder="Nhập mật khẩu..."
                      className="w-full bg-[#141413] border border-[#383834] focus:border-amber-400 rounded-xl px-3.5 py-2.5 text-sm text-white font-mono tracking-widest focus:outline-none pr-16"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPasswordChars((v) => !v)}
                      className="absolute right-2.5 top-1/2 -translate-y-1/2 text-[11px] text-neutral-400 hover:text-white px-2 py-1 rounded"
                    >
                      {showPasswordChars ? 'Ẩn' : 'Hiện'}
                    </button>
                  </div>
                  {passwordError && (
                    <p className="text-xs text-red-400 font-medium">{passwordError}</p>
                  )}
                </div>

                <div className="flex items-center justify-end gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => setShowPasswordModal(false)}
                    className="px-4 py-2 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-300 text-xs font-semibold"
                  >
                    Hủy
                  </button>
                  <button
                    type="submit"
                    className="px-5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-red-600 hover:from-amber-600 hover:to-red-700 text-white text-xs font-bold shadow-md"
                  >
                    Mở khóa
                  </button>
                </div>
              </form>
            </div>
          )}

          {showApiModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-xs p-4" onClick={() => setShowApiModal(false)}>
              <div className="w-full max-w-2xl rounded-2xl bg-[#1C1C1A] border border-[#383834] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]" onClick={(e) => e.stopPropagation()}>
                <div className="px-6 py-4 border-b border-[#2C2C29] flex items-center justify-between bg-[#181816]">
                  <div>
                    <h2 className="text-base font-bold text-white">Cấu hình API Keys, Auto-Swap & System Prompt Blender 5.0</h2>
                    <p className="text-[11px] text-neutral-400 mt-0.5">
                      Đã mở khóa bảo mật. Cài đặt API Key cho Gemini, Claude, OpenAI GPT và System Prompt mặc định cho Blender 5.0.
                    </p>
                  </div>
                  <button onClick={() => setShowApiModal(false)} className="text-neutral-400 hover:text-white">
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <div className="p-5 overflow-y-auto space-y-4 text-xs">
                  <div className="p-4 rounded-xl bg-[#141413] border border-amber-500/40 space-y-2.5">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                      <div className="flex items-center gap-2">
                        <Box className="w-4 h-4 text-amber-400" />
                        <span className="font-bold text-white text-sm">
                          System Prompt Mặc định: Chuẩn Code Addon Blender 5.0 (Áp dụng cho Mọi Model)
                        </span>
                      </div>
                      <div className="flex items-center gap-2">
                        <label className="flex items-center gap-1.5 text-[11px] text-emerald-400 font-semibold cursor-pointer">
                          <input
                            type="checkbox"
                            checked={apiConfig.enableBlender5MasterPrompt !== false}
                            onChange={(e) =>
                              setApiConfig((p) => ({ ...p, enableBlender5MasterPrompt: e.target.checked }))
                            }
                            className="accent-red-600"
                          />
                          <span>Kích hoạt cho Gemini / Claude / GPT</span>
                        </label>
                        <button
                          onClick={() =>
                            setApiConfig((p) => ({ ...p, blender5MasterPrompt: DEFAULT_BLENDER_5_MASTER_PROMPT }))
                          }
                          className="px-2 py-1 rounded bg-neutral-800 hover:bg-neutral-700 text-neutral-300 text-[10px]"
                        >
                          Khôi phục mặc định
                        </button>
                      </div>
                    </div>
                    <textarea
                      rows={5}
                      value={apiConfig.blender5MasterPrompt || DEFAULT_BLENDER_5_MASTER_PROMPT}
                      onChange={(e) =>
                        setApiConfig((p) => ({ ...p, blender5MasterPrompt: e.target.value }))
                      }
                      className="w-full bg-[#1C1C1A] border border-[#383834] focus:border-amber-400 rounded-lg p-2.5 text-[11px] text-neutral-200 font-mono leading-relaxed focus:outline-none"
                    />
                  </div>

                  {[
                    {
                      id: 'gemini',
                      title: '1. Google Gemini API Keys (Khuyên dùng cho đọc & phân tích ảnh)',
                      primaryField: 'geminiKey',
                      backupField: 'geminiBackupKeys',
                      placeholder: 'Để trống để dùng Gemini tích hợp sẵn, hoặc dán AIzaSy...'
                    },
                    {
                      id: 'anthropic',
                      title: '2. Anthropic Claude API Keys',
                      primaryField: 'anthropicKey',
                      backupField: 'anthropicBackupKeys',
                      placeholder: 'sk-ant-...'
                    },
                    {
                      id: 'openai',
                      title: '3. OpenAI GPT API Keys (GPT-4o, GPT-4.1, o3)',
                      primaryField: 'openaiKey',
                      backupField: 'openaiBackupKeys',
                      placeholder: 'sk-proj-... hoặc sk-...'
                    }
                  ].map((prov) => {
                    const pool = getProviderKeyList(prov.id);
                    const deadMap = apiConfig.deadKeysMap || {};
                    return (
                      <div key={prov.id} className="p-4 rounded-xl bg-[#141413] border border-[#2C2C29] space-y-3">
                        <div className="flex items-center justify-between flex-wrap gap-2">
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-white text-sm">{prov.title}</span>
                            <span className="px-2 py-0.5 rounded-full bg-red-600/20 text-red-300 border border-red-500/30 text-[11px] font-bold">
                              {pool.length > 0 ? `${pool.length} Key trong Pool` : prov.id === 'gemini' ? 'Đang dùng Key tích hợp sẵn' : '0 Key'}
                            </span>
                          </div>
                          <button
                            onClick={() => manualRotateKey(prov.id)}
                            className="px-2.5 py-1 rounded-lg bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/40 font-semibold"
                          >
                            🔄 Đảo Key sang dự phòng
                          </button>
                        </div>

                        <div className="space-y-1">
                          <label className="text-[11px] text-neutral-400 font-medium">
                            Key đang dùng chính (Primary Key):
                          </label>
                          <input
                            type="text"
                            value={apiConfig[prov.primaryField] || ''}
                            onChange={(e) => setApiConfig((p) => ({ ...p, [prov.primaryField]: e.target.value }))}
                            placeholder={prov.placeholder}
                            className="w-full bg-[#1C1C1A] border border-[#383834] focus:border-red-500 rounded-lg px-3 py-2 text-white font-mono focus:outline-none"
                          />
                        </div>

                        <div className="p-3 rounded-xl bg-[#1B1B18] border border-dashed border-red-500/40 space-y-2">
                          <label className="text-[11px] font-semibold text-red-300 block">
                            ➕ Nhập thêm API Key dự phòng để tự động Swap khi Key chính hết hạn:
                          </label>
                          <div className="flex gap-2">
                            <input
                              type="text"
                              value={newBackupKeyInput[prov.id] || ''}
                              onChange={(e) =>
                                setNewBackupKeyInput((prev) => ({ ...prev, [prov.id]: e.target.value }))
                              }
                              onKeyDown={(e) => {
                                if (e.key === 'Enter') {
                                  e.preventDefault();
                                  addBackupKeyForProvider(prov.id);
                                }
                              }}
                              placeholder="Dán thêm 1 hoặc nhiều Key dự phòng cách nhau bằng dấu phẩy..."
                              className="flex-1 bg-[#141413] border border-[#383834] focus:border-red-500 rounded-lg px-3 py-1.5 text-white font-mono focus:outline-none"
                            />
                            <button
                              onClick={() => addBackupKeyForProvider(prov.id)}
                              className="px-3.5 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white font-bold shrink-0 transition shadow-xs"
                            >
                              + Thêm Key Swap
                            </button>
                          </div>
                        </div>

                        {pool.length > 0 && (
                          <div className="space-y-1 max-h-32 overflow-y-auto pr-1">
                            {pool.map((k, kIdx) => {
                              const isDead = Boolean(deadMap[k]);
                              return (
                                <div
                                  key={k + '-' + kIdx}
                                  className={`flex items-center justify-between px-3 py-1.5 rounded-lg border ${
                                    kIdx === 0
                                      ? 'bg-red-950/30 border-red-500/50 text-white'
                                      : 'bg-[#1C1C1A] border-[#2C2C29] text-neutral-300'
                                  }`}
                                >
                                  <div className="flex items-center gap-2 min-w-0">
                                    <span className={`text-[10px] px-2 py-0.5 rounded font-bold shrink-0 ${kIdx === 0 ? 'bg-red-600 text-white' : 'bg-neutral-800 text-neutral-300'}`}>
                                      {kIdx === 0 ? '★ Key Chính' : `Dự phòng #${kIdx}`}
                                    </span>
                                    <span className="font-mono text-xs truncate">{maskApiKey(k)}</span>
                                    {isDead && (
                                      <span className="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300">
                                        Đã Swap ({deadMap[k]})
                                      </span>
                                    )}
                                  </div>
                                  <div className="flex items-center gap-1 shrink-0">
                                    {kIdx > 0 && (
                                      <button
                                        onClick={() => promoteSpecificKeyToPrimary(prov.id, k)}
                                        className="px-2 py-0.5 rounded bg-red-600/20 hover:bg-red-600/40 text-red-300 text-[10px] font-semibold"
                                      >
                                        Đặt làm chính
                                      </button>
                                    )}
                                    <button
                                      onClick={() => removeKeyFromProviderPool(prov.id, k)}
                                      className="p-1 rounded hover:bg-red-500/20 text-neutral-400 hover:text-red-400"
                                    >
                                      <Trash2 className="w-3.5 h-3.5" />
                                    </button>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                <div className="px-6 py-3.5 border-t border-[#2C2C29] bg-[#181816] flex justify-end">
                  <button
                    onClick={() => {
                      ['anthropic', 'gemini', 'openai'].forEach((p) => {
                        if ((newBackupKeyInput[p] || '').trim()) addBackupKeyForProvider(p);
                      });
                      setShowApiModal(false);
                      showToast('Đã lưu cấu hình API & danh sách Key!');
                    }}
                    className="px-5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold"
                  >
                    Lưu & Hoàn tất
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
